name: metric_semantics
label:
  en_US: Metric Semantics
  zh_Hans: 指标语义与口径仲裁
description:
  en_US: >-
    Register metric calibers, detect definition conflicts, and get a structured
    arbitration decision before Text2SQL — so an agent never silently mixes two
    different definitions of the same business metric.
  zh_Hans: >-
    在 Text2SQL 之前注册指标口径、检测口径冲突并给出结构化仲裁决策，
    避免 Agent 把同一个业务指标的两种不同定义混用。
