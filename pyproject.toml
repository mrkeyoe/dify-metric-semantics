[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-metric-semantics"
version = "0.1.0"
description = "Semantic metric registry, caliber conflict detection and arbitration for Dify agents before Text2SQL"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mrkeyoe" }]
keywords = ["dify", "plugin", "semantic-layer", "metrics", "text2sql"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mrkeyoe/dify-metric-semantics"

[tool.setuptools]
packages = ["core", "adapters"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]